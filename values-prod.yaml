# Subchart Configurations
kafka:
  fullnameOverride: kafka
  image:
    repository: bitnamilegacy/kafka
    tag: 3.9.0-debian-12-r12
  listeners:
    client:
      protocol: PLAINTEXT

vault:
  server:
    dev:
      enabled: false
    dataStorage:
      enabled: true
      size: 250Mi
    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "file" {
          path = "/vault/data"
        }
  injector:
  
    enabled: false

external-secrets:
  installCRDs: true

cert-manager:
  installCRDs: true

ingress-nginx:
  controller:
    service:
      type: NodePort

# Global settings for all pods
global:
  security:
    allowInsecureImages: true
  replicaCount: 1
  configServerUrl: "http://config-service-svc:80"
  profile: prod
# List every microservice here. The template will loop through this list.
microservices:
  gateway-service:
    image: junaiduthman/gateway-service
    tag: latest
    port: 8080
    type: springboot
    serviceType: ClusterIP # Ingress is now the entry point — no need for LoadBalancer
    needsConfigServer: true
    envFromSecret: "app-secrets"
  property-microservice:
    image: junaiduthman/property-management-service
    tag: latest
    port: 8080
    type: springboot
    needsConfigServer: true
    envFromSecret: "app-secrets"
  user-management-service:
    image: junaiduthman/user-management-service
    tag: latest
    port: 8080
    type: springboot
    needsConfigServer: true
    envFromSecret: "app-secrets"
  rental-agreement-microservice:
    image: junaiduthman/rental-agreement-v2
    tag: latest
    port: 8080
    type: springboot
    needsConfigServer: true
    envFromSecret: "app-secrets"
  ml-pricesuggestionmodel:
    image: junaiduthman/ml-pricesuggestionmodel
    tag: latest
    port: 5000
    type: python
  property-recommendation-engine:
    image: junaiduthman/property-recommendation-engine
    tag: latest
    port: 5000
    type: python
  tenant-risk-scoring:
    image: junaiduthman/tenant-risk-scoring
    tag: latest
    port: 5000
    type: python
  predictive-heatmaps-of-neighborhood-price-evolution:
    image: junaiduthman/predictive-heatmaps-of-neighborhood-price-evolution
    tag: latest
    port: 5000
    type: python
  notification-service:
    image: junaiduthman/notification-service
    tag: latest
    port: 8080
    type: springboot
    needsConfigServer: true
    envFromSecret: "app-secrets"
    env:
      KAFKA_BOOTSTRAP_SERVERS: "kafka.prod.svc.cluster.local:9092"
  config-service:
    image: junaiduthman/config-service
    tag: 15-bf1763b
    port: 8888
    type: springboot
  auth-server:
    image: junaiduthman/authorization-service
    tag: latest
    port: 8080
    type: springboot
    needsConfigServer: true
    envFromSecret: "app-secrets"
  public-app:
    image: junaiduthman/public-app
    tag: 21-76d4f5f
    port: 80
    type: angular
    serviceType: ClusterIP # Ingress is now the entry point — no need for LoadBalancer
databases:
  user-db:
    databaseName: userdb
    storage: 250Mi
  property-db:
    databaseName: propertydb
    storage: 250Mi
  rental-agreement-db:
    databaseName: rental_agreement_db
    storage: 250Mi
  notification-db:
    databaseName: notifications
    storage: 250Mi
