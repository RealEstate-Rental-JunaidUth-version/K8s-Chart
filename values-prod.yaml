# =============================================================================
# MINIMAL CLOUD TEST CONFIGURATION
# Only config-service + gateway-service to fit on Free Tier m7i-flex.large
# (2 vCPU / 8 GiB RAM)
# =============================================================================

# KAFKA DISABLED - Not needed for minimal test
# kafka:
#   fullnameOverride: kafka
#   controller:
#     replicaCount: 0
#   image:
#     repository: bitnamilegacy/kafka
#     tag: 3.9.0-debian-12-r12
#   listeners:
#     client:
#       protocol: PLAINTEXT
# enabled: false
# VAULT DISABLED - Using Sealed Secrets instead
# vault: ...

# EXTERNAL-SECRETS DISABLED
# external-secrets: ...

cert-manager:
  installCRDs: true

ingress-nginx:
  controller:
    service:
      type: LoadBalancer
    ingressClassResource:
      default: true

# Global settings for all pods
global:
  security:
    allowInsecureImages: true
  replicaCount: 1
  configServerUrl: "http://config-service-svc:80"
  profile: prod

# =============================================================================
# MICROSERVICES - Only 2 active for minimal test
# =============================================================================
microservices:

  # ── 1. Config Server (must start first) ───────────────────────────────────
  config-service:
    image: junaiduthman/config-service
    tag: 15-bf1763b
    port: 8888
    type: springboot
    env:
      JAVA_OPTS: "-Xms128m -Xmx256m"

  # ── 2. Gateway Service ─────────────────────────────────────────────────────
  gateway-service:
    image: junaiduthman/gateway-service
    tag: latest
    port: 8080
    type: springboot
    serviceType: ClusterIP
    needsConfigServer: true
    envFromSecret: "app-secrets"
    env:
      JAVA_OPTS: "-Xms128m -Xmx256m"

  # ── DISABLED - Too heavy for Free Tier node ────────────────────────────────
  # property-microservice:
