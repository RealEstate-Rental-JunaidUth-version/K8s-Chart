  #   port: 8080
  #   type: springboot
  #   needsConfigServer: true
  #   envFromSecret: "app-secrets"

  # ── 3. User Management Service ────────────────────────────────────────────
  user-management-service:
    image: junaiduthman/user-management-service
    tag: latest
    port: 8080
    type: springboot
    needsConfigServer: true
    envFromSecret: "app-secrets"
    env:
      JAVA_OPTS: "-Xms128m -Xmx256m"

