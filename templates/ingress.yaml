apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realestate-ingress
  annotations:
    # Tell Kubernetes to use the Nginx Ingress Controller
    kubernetes.io/ingress.class: "nginx"

    # Automatically issue a TLS certificate via cert-manager + Let's Encrypt
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Redirect all HTTP traffic to HTTPS automatically
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # WebSocket support via native timeouts
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # CORS handled by Gateway service
    nginx.ingress.kubernetes.io/enable-cors: "false"

    # Rewrite is NOT used here — we keep the /api/ prefix
    # because the gateway expects it
spec:
  tls:
    - hosts:
        - www.realestate-junaid.freeddns.org
      # cert-manager will create this secret automatically with the TLS certificate
      secretName: realestate-tls

  rules:
    - host: www.realestate-junaid.freeddns.org
      http:
        paths:

          # ── 1. API routes → Gateway ──────────────────────────────
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: gateway-service-svc
                port:
                  number: 80

          # ── 2. WebSocket routes → Gateway ────────────────────────
          - path: /ws-notifications/
            pathType: Prefix
            backend:
              service:
                name: gateway-service-svc
                port:
                  number: 80

          # ── 3. OAuth2 routes → Gateway ───────────────────────────
          - path: /oauth2/
            pathType: Prefix
            backend:
              service:
                name: gateway-service-svc
                port:
                  number: 80

          # ── 4. OIDC Discovery routes → Gateway ───────────────────
          - path: /.well-known/
            pathType: Prefix
            backend:
              service:
                name: gateway-service-svc
                port:
                  number: 80

          # ── 5. Everything else → Angular public-app ──────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public-app-svc
                port:
                  number: 80
