apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realestate-ingress
  annotations:
    # Tell Kubernetes to use the Nginx Ingress Controller
    kubernetes.io/ingress.class: "nginx"

    # WebSocket support for /ws-notifications/
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/server-snippets: |
      location /ws-notifications/ {
        proxy_pass http://gateway-service-svc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
      }

    # CORS headers if needed
    nginx.ingress.kubernetes.io/enable-cors: "true"

    # Rewrite is NOT used here — we keep the /api/ prefix
    # because the gateway expects it
spec:
  rules:
    - http:
        paths:

          # ── 1. API routes → Gateway ──────────────────────────────
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: gateway-service-svc
                port:
                  number: 80

          # ── 2. OAuth2 routes → Gateway ───────────────────────────
          - path: /oauth2/
            pathType: Prefix
            backend:
              service:
                name: gateway-service-svc
                port:
                  number: 80

          # ── 3. OIDC Discovery routes → Gateway ───────────────────
          - path: /.well-known/
            pathType: Prefix
            backend:
              service:
                name: gateway-service-svc
                port:
                  number: 80

          # ── 4. Everything else → Angular public-app ──────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public-app-svc
                port:
                  number: 80
