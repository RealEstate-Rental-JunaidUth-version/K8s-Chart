apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-passwords
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: mysql-passwords
    creationPolicy: Owner
  data:
    - secretKey: mysql-root-password
      remoteRef:
        key: secret/data/realestate/mysql
        property: root-password
