{{- range $name, $config := .Values.databases }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  serviceName: "{{ $name }}-svc"
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-passwords
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: {{ $config.databaseName }}
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: {{ $name }}-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: {{ $name }}-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $config.storage | default "500Mi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-svc
  labels:
    app: {{ $name }}
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: {{ $name }}
  clusterIP: None
---
{{- end }}
